      .crec-grid {
        display: flex;

      }
      .crec-card {
        position: relative;
        background: #fff; border: 1px solid #e8e2d3; border-radius: 10px;
        padding: 16px 20px; cursor: pointer;
        transition: transform .15s, box-shadow .15s, border-color .15s;
        display: flex; align-items: center; flex-wrap: wrap;
        gap: 6px 18px;
      }
      /* Hover bridge extending from the right edge of the card to the popover */
      .crec-card::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0;
        left: 100%;
        width: 18px;
        pointer-events: none;
      }
      .crec-card:hover::after { pointer-events: auto; }
      .crec-card:hover {
        border-color: #c89a3a;
        box-shadow: 0 6px 18px rgba(31, 61, 46, 0.08);
      }
      .crec-card h3 { margin: 0; font-size: 1.05rem; color: #1f3d2e; flex: 0 0 auto; }
      .crec-card .crec-grade { color: #6a6a6a; font-size: .88rem; flex: 0 0 auto; }
      .crec-card .crec-meta {
        margin-left: auto;
        display: flex; flex-wrap: wrap; gap: 6px 8px;
        font-size: .82rem; color: #6a6a6a;
      }
      .crec-card .crec-meta span { background: #f5f0e6; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
      .crec-card .crec-quick { display: none; } /* hidden on list view, shown in popover instead */
      .crec-card.is-open { border-color: #1f3d2e; box-shadow: 0 10px 28px rgba(31, 61, 46, 0.12); }

      /* Hover preview popover — appears to the RIGHT of the row */
      .crec-popover {
        position: absolute;
        left: 100%;
        top: 50%;
        transform: translateY(-50%) translateX(-6px);
        z-index: 30;
        width: 300px;
        margin-left: 14px;
        background: #1f3d2e; color: #f5f0e6;
        padding: 14px 16px;
        border-radius: 8px;
        font-size: .88rem; line-height: 1.45;
        box-shadow: 0 14px 32px rgba(0,0,0,0.22);
        opacity: 0; pointer-events: none;
        transition: opacity .18s ease, transform .18s ease;
        transition-delay: 0s, 0s;
      }
      /* Invisible hover-bridge so the cursor can cross the gap without losing :hover */
      .crec-popover::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0;
        left: -20px;   /* covers the 14px gap + a little buffer */
        width: 22px;
      }
      .crec-popover::before {
        content: ""; position: absolute; top: 50%; left: -6px;
        width: 12px; height: 12px; background: #1f3d2e;
        transform: translateY(-50%) rotate(45deg);
      }
      .crec-card:hover .crec-popover,
      .crec-card:focus-within .crec-popover,
      .crec-popover:hover {
        opacity: 1; pointer-events: auto;
        transform: translateY(-50%) translateX(0);
      }
      /* Slight delay on hide so the cursor has time to cross from card to popover */
      .crec-popover {
        transition-delay: .12s;
      }
      .crec-card:hover .crec-popover,
      .crec-card:focus-within .crec-popover,
      .crec-popover:hover {
        transition-delay: 0s;
      }
      /* Suppress the popover only on the card whose detail is open;
         other cards still show their popover on hover so the user can keep exploring. */
      .crec-card.is-open .crec-popover { display: none !important; }
      .crec-popover strong { color: #c89a3a; }

      /* On narrow screens, fall back to popover below the row */
      @media (max-width: 860px) {
        .crec-popover {
          left: 50%; top: 100%;
          transform: translate(-50%, 8px);
          margin-left: 0;
          width: min(320px, 92vw);
        }
        .crec-popover::after {
          top: -12px; bottom: auto;
          left: 0; right: 0;
          width: auto; height: 14px;
        }
        .crec-popover::before {
          top: -6px; left: 50%;
          transform: translateX(-50%) rotate(45deg);
        }
        .crec-card:hover .crec-popover,
        .crec-card:focus-within .crec-popover,
        .crec-popover:hover {
          transform: translate(-50%, 4px);
        }
      }
      @media (hover: none) {
        .crec-popover { display: none; } /* touch devices: rely on click-to-open */
      }

      /* Expanded detail panel */
      .crec-detail {

        background: #fff; border: 1px solid #e8e2d3; border-radius: 8px;

      }
      .crec-fact .crec-fact-label {

      }
      .crec-fact .crec-fact-value { color: #1f3d2e; font-weight: 600; font-size: 1rem; }

      .crec-section { margin: 18px 0; }
      .crec-section h3 {
        font-size: 1.1rem; color: #1f3d2e;
        margin: 0 0 10px; padding-bottom: 6px;

      .crec-cta-row {
        display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px;

      .crec-cta-row .btn { font-size: .95rem; }

      .crec-empty {
        text-align: center; padding: 40px 0; color: #6a6a6a;

    </style>

            ["Week 2", "Polynomial & rational functions: end behavior, zeros, asymptotes."],

          link: "/programs#ap-courses",

      // Term configuration: dates, what courses run, and the scheduling info per course
      const TERMS = {
        "july": {
          label: "July 2026",
          dateRange: "June 29 – August 1, 2026",
          cadence: "5 weeks · see each course for weekly cadence",
          tuition: "$60/hr standard rate",
          summary: "Five-week summer intensives. Same instructor every week, small cohorts, paced for students who want to get ahead or catch up before the fall.",
          link: "/summer-schedule",
          faq: SUMMER_FAQ,
          courses: {
            "little-newtons":              { days: "Mon & Wed", time: "3:00 – 4:30 PM", perWeek: 2 },
            "kid-einsteins-a":             { days: "Tue & Wed", time: "3:00 – 5:00 PM", perWeek: 2 },
            "kid-einsteins-b":             { days: "Mon & Wed", time: "4:30 – 6:30 PM", perWeek: 2 },
            "young-fermats-prealgebra":    { days: "Tue & Thu", time: "5:00 – 7:00 PM", perWeek: 2 },
            "young-fermats-algebra-ignite":{ days: "Mon & Wed", time: "6:30 – 8:30 PM", perWeek: 2 },
            "young-fermats-geometry":      { days: "Tue & Thu", time: "7:00 – 9:00 PM", perWeek: 2 },
            "shsat-prep":                  { days: "Friday",    time: "3:00 – 5:00 PM", perWeek: 1 },
            "sat-math":                    { days: "Friday",    time: "5:00 – 7:00 PM", perWeek: 1 },
            "pre-calculus":                { days: "Friday",    time: "7:00 – 9:00 PM", perWeek: 1 }
          }
        },
        "august": {
          label: "August 2026",
          dateRange: "August 3 – September 4, 2026",
          cadence: "5 weeks · see each course for weekly cadence",
          tuition: "$60/hr standard rate",
          summary: "Second summer term, identical structure to July. Useful for families traveling in July or students who want a final reset before the school year starts.",
          link: "/august-schedule",
          faq: SUMMER_FAQ,
          courses: {
            "little-newtons":              { days: "Mon & Wed", time: "3:00 – 4:30 PM", perWeek: 2 },
            "kid-einsteins-a":             { days: "Tue & Wed", time: "3:00 – 5:00 PM", perWeek: 2 },
            "kid-einsteins-b":             { days: "Mon & Wed", time: "4:30 – 6:30 PM", perWeek: 2 },
            "young-fermats-prealgebra":    { days: "Tue & Thu", time: "5:00 – 7:00 PM", perWeek: 2 },
            "young-fermats-algebra-ignite":{ days: "Mon & Wed", time: "6:30 – 8:30 PM", perWeek: 2 },
            "young-fermats-geometry":      { days: "Tue & Thu", time: "7:00 – 9:00 PM", perWeek: 2 },
            "shsat-prep":                  { days: "Friday",    time: "3:00 – 5:00 PM", perWeek: 1 },
            "sat-math":                    { days: "Friday",    time: "5:00 – 7:00 PM", perWeek: 1 },
            "pre-calculus":                { days: "Friday",    time: "7:00 – 9:00 PM", perWeek: 1 }
          }
        },
        "fall": {
          label: "Fall 2026",
          dateRange: "August 31 – December 20, 2026",
          cadence: "16 weeks · 1 class/week · 120 min each",
          tuition: "$1,920 per course · $60/hr standard rate",
          summary: "Full 16-week semester paced to the NYC school calendar. Continuous arc — students roll directly into the Winter/Spring term in January without re-applying.",
          link: "/fall-schedule",
          faq: FALL_FAQ,
          courses: {
            "little-newtons":              { days: "Mon or Wed", time: "3:30 – 5:00 PM", perWeek: 1 },
            "kid-einsteins-a":             { days: "Tue or Wed", time: "4:00 – 6:00 PM", perWeek: 1 },
            "kid-einsteins-b":             { days: "Mon or Wed", time: "5:00 – 7:00 PM", perWeek: 1 },
            "young-fermats-prealgebra":    { days: "Tue or Thu", time: "6:00 – 8:00 PM", perWeek: 1 },
            "young-fermats-algebra-ignite":{ days: "Mon or Wed", time: "7:00 – 9:00 PM", perWeek: 1 },
            "young-fermats-geometry":      { days: "Tue or Thu", time: "8:00 – 10:00 PM", perWeek: 1 },
            "shsat-prep":                  { days: "Friday",     time: "4:00 – 6:00 PM", perWeek: 1 },
            "sat-math":                    { days: "Friday",     time: "6:00 – 8:00 PM", perWeek: 1 },
            "pre-calculus":                { days: "Friday",     time: "8:00 – 10:00 PM", perWeek: 1 }
          }
        }
      };

      // ============================================================
      // RENDER
      // ============================================================
      const tabs = document.querySelectorAll(".crec-tab");
      const headEl = document.getElementById("crec-term-head");
      const gridEl = document.getElementById("crec-grid");
      const detailEl = document.getElementById("crec-detail");
      let activeTerm = "july";
      let openCourse = null;

      function renderTerm(termKey) {
        activeTerm = termKey;
        openCourse = null;
        document.body.classList.remove("crec-detail-open");
        const term = TERMS[termKey];
        tabs.forEach(t => {
          const on = t.dataset.term === termKey;
          t.classList.toggle("is-active", on);
          t.setAttribute("aria-selected", on ? "true" : "false");
        });

        headEl.innerHTML = `
          <h2>${term.label}</h2>
          <span class="crec-term-dates">${term.dateRange}</span>
          <a class="crec-term-link" href="${term.link}">See full ${term.label} schedule →</a>
        `;

        const courseIds = Object.keys(term.courses);
        gridEl.innerHTML = courseIds.map(id => {
          const c = COURSES[id];
          const sched = term.courses[id];
          return `
            <div class="crec-card" data-course="${id}" tabindex="0" role="button" aria-expanded="false">
              <h3>${c.title}</h3>
              <div class="crec-grade">${c.grade}</div>
              <p class="crec-quick">${c.quick}</p>
              <div class="crec-meta">
                <span>${sched.days}</span>
                <span>${sched.time}</span>
              </div>
              <div class="crec-popover" role="tooltip">
                <strong>${c.title}</strong> — ${c.grade}<br/>
                ${c.quick}<br/><br/>
                <strong>When:</strong> ${sched.days}, ${sched.time}<br/>
                <strong>Term:</strong> ${term.dateRange}<br/>
                <em>Click to see syllabus, dates &amp; FAQ →</em>
              </div>
            </div>
          `;
        }).join("");

        detailEl.classList.remove("is-open");
        detailEl.innerHTML = "";

        // Wire card clicks (popover lives inside the card, so it bubbles up too)
        gridEl.querySelectorAll(".crec-card").forEach(card => {
          card.addEventListener("click", () => openDetail(card.dataset.course));
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openDetail(card.dataset.course);
            }
          });
        });
        // Make the popover (which is positioned outside its card visually) also clickable to open detail
        gridEl.querySelectorAll(".crec-popover").forEach(pop => {
          pop.addEventListener("click", (e) => {
            e.stopPropagation();
            const card = pop.closest(".crec-card");
            if (card) openDetail(card.dataset.course);
          });
        });
      }

      function openDetail(courseId) {
        const term = TERMS[activeTerm];
        const c = COURSES[courseId];
        const sched = term.courses[courseId];
        if (!c || !sched) return;
        openCourse = courseId;
        document.body.classList.add("crec-detail-open");

        // Pick fall override syllabus if available for fall term
        const syllabus = (activeTerm === "fall" && c.fallSyllabusOverride) ? c.fallSyllabusOverride : c.syllabus;
        const perWeek = sched.perWeek || 1;
        // Parse session length in minutes from the time string (e.g. "3:00 – 4:30 PM" → 90 min)
        const sessionMin = (() => {
          const m = sched.time.match(/(\d{1,2}):(\d{2})\s*–\s*(\d{1,2}):(\d{2})/);
          if (!m) return 120;
          let [_, h1, m1, h2, m2] = m;
          const start = parseInt(h1,10)*60 + parseInt(m1,10);
          let end = parseInt(h2,10)*60 + parseInt(m2,10);
          if (end < start) end += 12*60;
          return end - start;
        })();
        const weeks = (activeTerm === "fall") ? 16 : 5;
        const totalSessions = perWeek * weeks;
        const totalHours = (totalSessions * sessionMin) / 60;
        const sessionCount = `${totalSessions} sessions · ${sessionMin} min each · ${perWeek}×/week`;
        const tuition = `$${(totalHours * 60).toLocaleString("en-US")} (${totalHours} h × $60/hr)`;

        detailEl.innerHTML = `
          <div class="crec-detail-head">
            <h2>${c.title}</h2>
            <span class="crec-grade-pill">${c.grade}</span>
            <button class="crec-close" aria-label="Close course details">Close ✕</button>
          </div>
          <p class="crec-detail-overview">${c.description}</p>

          <div class="crec-detail-grid">
            <div class="crec-fact"><span class="crec-fact-label">Term</span><span class="crec-fact-value">${term.label}</span></div>
            <div class="crec-fact"><span class="crec-fact-label">Dates</span><span class="crec-fact-value">${term.dateRange}</span></div>
            <div class="crec-fact"><span class="crec-fact-label">Days</span><span class="crec-fact-value">${sched.days}</span></div>
            <div class="crec-fact"><span class="crec-fact-label">Time</span><span class="crec-fact-value">${sched.time}</span></div>
            <div class="crec-fact"><span class="crec-fact-label">Sessions</span><span class="crec-fact-value">${sessionCount}</span></div>
            <div class="crec-fact"><span class="crec-fact-label">Tuition</span><span class="crec-fact-value">${tuition}</span></div>
            <div class="crec-fact"><span class="crec-fact-label">Level</span><span class="crec-fact-value">${c.level}</span></div>
            <div class="crec-fact"><span class="crec-fact-label">Cadence</span><span class="crec-fact-value">${term.cadence}</span></div>
          </div>

          <div class="crec-section">
            <h3>Syllabus</h3>
            <table class="crec-syllabus">
              <thead><tr><th>Week</th><th>Main content</th></tr></thead>
              <tbody>
                ${syllabus.map(row => `<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`).join("")}
              </tbody>
            </table>
          </div>

          <div class="crec-section crec-faq">
            <h3>Frequently asked</h3>
            ${term.faq.map(([q,a]) => `
              <details>
                <summary>${q}</summary>
                <p>${a}</p>
              </details>
            `).join("")}
          </div>

          <div class="crec-cta-row">
            <a class="btn btn--primary" href="/evaluation">Book free evaluation</a>
            <a class="btn btn--secondary" href="${c.link}">More about ${c.title}</a>
            <a class="btn btn--secondary" href="${term.link}">${term.label} full schedule</a>
          </div>
        `;
        detailEl.classList.add("is-open");

        // Mark active card
        gridEl.querySelectorAll(".crec-card").forEach(card => {
          card.classList.toggle("is-open", card.dataset.course === courseId);
          card.setAttribute("aria-expanded", card.dataset.course === courseId ? "true" : "false");
        });

        // Wire close button
        detailEl.querySelector(".crec-close").addEventListener("click", () => {
          detailEl.classList.remove("is-open");
          gridEl.querySelectorAll(".crec-card").forEach(card => {
            card.classList.remove("is-open");
            card.setAttribute("aria-expanded", "false");
          });
          openCourse = null;
          document.body.classList.remove("crec-detail-open");
        });

        // Scroll into view
        detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      tabs.forEach(t => t.addEventListener("click", () => renderTerm(t.dataset.term)));

      // Initial render
      renderTerm("july");
    </script>
