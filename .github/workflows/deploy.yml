name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q 'CHECKIN_AUTO_SEND = "true"' wrangler.toml; then
            wrangler secret list > /tmp/worker-secret-names.json
            node -e 'const names=JSON.parse(require("fs").readFileSync("/tmp/worker-secret-names.json","utf8")).map(s=>s.name); for(const name of ["ADMIN_PASSWORD","STRIPE_SECRET_KEY","RESEND_API_KEY"]) { if(!names.includes(name)) throw Error("Missing required Worker secret: "+name); } console.log("Check-in email delivery configuration present; no secret values read.");'
          fi
          wrangler deploy
