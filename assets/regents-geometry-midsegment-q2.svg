<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Triangle ABC with midpoints D on CA and E on CB, with midsegment DE parallel to AB">
  <style>
    .tri { fill: none; stroke: #1a1a1a; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .mid { fill: none; stroke: #1a1a1a; stroke-width: 2.2; stroke-linecap: round; }
    .pt  { fill: #1a1a1a; }
    .lbl { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 22px; fill: #1a1a1a; }
  </style>
  <!-- Triangle: C at top-left area, A at bottom-left, B at far right -->
  <!-- C(130, 40), A(230, 320), B(600, 310) -->
  <polygon class="tri" points="130,40 230,320 600,310" />
  <!-- Midpoints: D = midpoint of CA = (180, 180), E = midpoint of CB = (365, 175) -->
  <line class="mid" x1="180" y1="180" x2="365" y2="175" />
  <!-- Vertex/midpoint dots -->
  <circle class="pt" cx="130" cy="40"  r="3.5"/>
  <circle class="pt" cx="230" cy="320" r="3.5"/>
  <circle class="pt" cx="600" cy="310" r="3.5"/>
  <circle class="pt" cx="180" cy="180" r="3.5"/>
  <circle class="pt" cx="365" cy="175" r="3.5"/>
  <!-- Labels -->
  <text class="lbl" x="112" y="32">C</text>
  <text class="lbl" x="217" y="352">A</text>
  <text class="lbl" x="608" y="322">B</text>
  <text class="lbl" x="152" y="184">D</text>
  <text class="lbl" x="375" y="171">E</text>
</svg>
