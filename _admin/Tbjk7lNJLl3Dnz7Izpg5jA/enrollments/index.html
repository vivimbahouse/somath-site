<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enrollments — SOMATH Admin</title>
<style>
  :root {
    --green: #1f3d2e;
    --green-dark: #142a1f;
    --gold: #c89a3a;
    --cream: #f5f0e6;
    --ink: #1b1b1b;
    --muted: #5b6660;
    --line: #d8d2c4;
    --err: #a83232;
    --ok: #2a6b3e;
    --intent: #8a6b1a;
    --paid: #2a6b3e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    margin: 0;
    padding: 20px 16px 60px;
    line-height: 1.5;
  }
  .wrap { max-width: 1400px; margin: 0 auto; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  h1 { font-size: 22px; margin: 0; color: var(--green); }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  input[type=text], input[type=password], select {
    padding: 8px 10px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
    border-color: var(--gold);
  }
  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    background: var(--green);
    color: #fff;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  button:hover { background: var(--green-dark); }
  button.ghost {
    background: #fff;
    color: var(--green);
    border: 1px solid var(--line);
  }
  button.ghost:hover { background: var(--cream); }
  .login-wrap {
    max-width: 420px;
    margin: 80px auto;
  }
  .login-wrap h1 { margin-bottom: 6px; }
  .login-wrap .card { padding: 24px; }
  .login-wrap label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    color: var(--green);
    margin: 0 0 6px;
  }
  .login-wrap input { width: 100%; margin-bottom: 12px; }
  .login-wrap button { width: 100%; padding: 11px; }
  .err {
    color: var(--err);
    font-size: 13px;
    margin: 0 0 12px;
  }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .pill.intent { background: #fff4d6; color: var(--intent); border: 1px solid #e3cf90; }
  .pill.paid   { background: #d9efe0; color: var(--paid);   border: 1px solid #9ec9aa; }
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 1100px;
  }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }
  th {
    background: var(--cream);
    color: var(--green);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    position: sticky;
    top: 0;
  }
  td.wrap-col { white-space: normal; max-width: 220px; }
  tr:hover td { background: #fcfaf3; }
  .stat-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .stat-row strong { color: var(--ink); font-size: 16px; }
  a.lnk { color: var(--green); text-decoration: none; border-bottom: 1px dotted var(--green); }
  a.lnk:hover { color: var(--gold); border-bottom-color: var(--gold); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 12px;
    font-style: italic;
  }
  .loading {
    text-align: center;
    color: var(--muted);
    padding: 48px 12px;
  }
  .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .right { margin-left: 0; }
  }
</style>
</head>
<body>

<div id="loginView" class="login-wrap" style="display:none">
  <h1>SOMATH Enrollments</h1>
  <p class="sub">Admin sign in</p>
  <div class="card">
    <p id="loginErr" class="err" style="display:none"></p>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="loginBtn">Sign in</button>
  </div>
</div>

<div id="appView" class="wrap" style="display:none">
  <header class="top">
    <div>
      <h1>Enrollments</h1>
      <p class="sub">Live from Cloudflare KV · intent records created at form submit, paid status from Stripe webhook</p>
    </div>
    <div class="right">
      <button id="refreshBtn" class="ghost">Refresh</button>
      <button id="csvBtn">Download CSV</button>
      <button id="logoutBtn" class="ghost">Sign out</button>
    </div>
  </header>

  <div class="stat-row" id="statRow"></div>

  <div class="card">
    <div class="controls">
      <input id="filterText" type="text" placeholder="Search name, email, course…" style="min-width:240px">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="paid">Paid</option>
        <option value="intent">Intent only</option>
      </select>
      <select id="filterCourse">
        <option value="">All courses</option>
      </select>
    </div>
    <div id="tableHost">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = "somath_admin_pw";
  var loginView = document.getElementById("loginView");
  var appView = document.getElementById("appView");
  var pwInput = document.getElementById("pw");
  var loginErr = document.getElementById("loginErr");
  var loginBtn = document.getElementById("loginBtn");
  var refreshBtn = document.getElementById("refreshBtn");
  var csvBtn = document.getElementById("csvBtn");
  var logoutBtn = document.getElementById("logoutBtn");
  var filterText = document.getElementById("filterText");
  var filterStatus = document.getElementById("filterStatus");
  var filterCourse = document.getElementById("filterCourse");
  var tableHost = document.getElementById("tableHost");
  var statRow = document.getElementById("statRow");

  var allRows = [];

  function showLogin(msg){
    appView.style.display = "none";
    loginView.style.display = "";
    if (msg) {
      loginErr.textContent = msg;
      loginErr.style.display = "";
    } else {
      loginErr.style.display = "none";
    }
    setTimeout(function(){ pwInput.focus(); }, 30);
  }
  function showApp(){
    loginView.style.display = "none";
    appView.style.display = "";
  }
  function getPw(){ try { return sessionStorage.getItem(KEY) || ""; } catch(e){ return ""; } }
  function setPw(v){ try { sessionStorage.setItem(KEY, v); } catch(e){} }
  function clearPw(){ try { sessionStorage.removeItem(KEY); } catch(e){} }

  function esc(s){
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function fmtTime(iso){
    if (!iso) return "";
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("en-US", { timeZone: "America/New_York", year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    } catch(e){ return iso; }
  }
  function fmtAmount(a){
    if (a === null || a === undefined || a === "") return "";
    var n = Number(a);
    if (isNaN(n)) return String(a);
    return "$" + n.toFixed(2);
  }

  function fetchData(){
    var pw = getPw();
    if (!pw) { showLogin(); return; }
    tableHost.innerHTML = '<div class="loading">Loading…</div>';
    fetch("/api/enrollments", {
      headers: { "x-admin-password": pw },
      cache: "no-store"
    }).then(function(r){
      if (r.status === 401 || r.status === 403) {
        clearPw();
        showLogin("Wrong password.");
        return null;
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(data){
      if (!data) return;
      allRows = (data && data.enrollments) ? data.enrollments : [];
      populateCourses();
      render();
    }).catch(function(err){
      tableHost.innerHTML = '<div class="empty">Error loading: ' + esc(err.message) + '</div>';
    });
  }

  function populateCourses(){
    var existing = filterCourse.value;
    var seen = {};
    var opts = ['<option value="">All courses</option>'];
    allRows.forEach(function(r){
      var c = r.courseTitle || r.course || "";
      if (!c || seen[c]) return;
      seen[c] = true;
      opts.push('<option value="' + esc(c) + '">' + esc(c) + '</option>');
    });
    filterCourse.innerHTML = opts.join("");
    if (existing && seen[existing]) filterCourse.value = existing;
  }

  function applyFilters(rows){
    var q = filterText.value.trim().toLowerCase();
    var s = filterStatus.value;
    var c = filterCourse.value;
    return rows.filter(function(r){
      if (s && r.status !== s) return false;
      if (c && (r.courseTitle || r.course) !== c) return false;
      if (q) {
        var hay = [
          r.parentName, r.parentEmail, r.parentPhone, r.studentName,
          r.course, r.courseTitle, r.day, r.startDate, r.stripeCustomerId, r.stripeSessionId, r.ref
        ].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function render(){
    var rows = applyFilters(allRows);
    var paid = 0, intent = 0, total = 0;
    rows.forEach(function(r){
      if (r.status === "paid") { paid++; total += Number(r.amountUsd || 0); }
      else if (r.status === "intent") intent++;
    });
    statRow.innerHTML =
      '<div><strong>' + rows.length + '</strong> showing</div>' +
      '<div><strong>' + paid + '</strong> paid</div>' +
      '<div><strong>' + intent + '</strong> intent only</div>' +
      '<div><strong>' + fmtAmount(total) + '</strong> collected</div>';

    if (!rows.length) {
      tableHost.innerHTML = '<div class="empty">No enrollments match.</div>';
      return;
    }

    var html = '<div class="table-wrap"><table><thead><tr>' +
      '<th>Created</th>' +
      '<th>Status</th>' +
      '<th>Course</th>' +
      '<th>Day</th>' +
      '<th>Start</th>' +
      '<th>Parent</th>' +
      '<th>Email</th>' +
      '<th>Phone</th>' +
      '<th>Student</th>' +
      '<th>Amount</th>' +
      '<th>Stripe</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function(r){
      var pill = '<span class="pill ' + esc(r.status || "intent") + '">' + esc(r.status || "intent") + '</span>';
      var stripeCol = "";
      if (r.stripeCustomerId) {
        stripeCol += '<a class="lnk" target="_blank" rel="noopener" href="https://dashboard.stripe.com/customers/' + esc(r.stripeCustomerId) + '">' + esc(r.stripeCustomerId) + '</a>';
      }
      if (r.stripeSessionId) {
        if (stripeCol) stripeCol += '<br>';
        stripeCol += '<span class="mono">' + esc(r.stripeSessionId) + '</span>';
      }
      html += '<tr>' +
        '<td>' + esc(fmtTime(r.createdAt)) + '</td>' +
        '<td>' + pill + '</td>' +
        '<td class="wrap-col">' + esc(r.courseTitle || r.course || "") + '</td>' +
        '<td>' + esc(r.day || "") + '</td>' +
        '<td>' + esc(r.startDate || "") + '</td>' +
        '<td>' + esc(r.parentName || "") + '</td>' +
        '<td>' + esc(r.parentEmail || "") + '</td>' +
        '<td>' + esc(r.parentPhone || "") + '</td>' +
        '<td>' + esc(r.studentName || "") + '</td>' +
        '<td>' + esc(fmtAmount(r.amountUsd)) + '</td>' +
        '<td class="wrap-col">' + stripeCol + '</td>' +
      '</tr>';
    });

    html += '</tbody></table></div>';
    tableHost.innerHTML = html;
  }

  loginBtn.addEventListener("click", function(){
    var v = pwInput.value.trim();
    if (!v) { showLogin("Enter the admin password."); return; }
    setPw(v);
    showApp();
    fetchData();
  });
  pwInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") loginBtn.click();
  });
  refreshBtn.addEventListener("click", fetchData);
  logoutBtn.addEventListener("click", function(){ clearPw(); allRows = []; showLogin(); });
  csvBtn.addEventListener("click", function(){
    var pw = getPw();
    if (!pw) { showLogin(); return; }
    var url = "/api/enrollments?format=csv&pw=" + encodeURIComponent(pw);
    window.location.href = url;
  });
  filterText.addEventListener("input", render);
  filterStatus.addEventListener("change", render);
  filterCourse.addEventListener("change", render);

  // Init
  if (getPw()) { showApp(); fetchData(); }
  else { showLogin(); }
})();
</script>
</body>
</html>
